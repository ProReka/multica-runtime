name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'autoscaler/**'
      - 'versions.env'
      - 'scripts/build.sh'
      - 'scripts/test-image.sh'
      - 'scripts/test-runtime.sh'
      - 'scripts/ci-*'
      - 'scripts/test-ci-*'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'autoscaler/**'
      - 'versions.env'
      - 'scripts/build.sh'
      - 'scripts/test-image.sh'
      - 'scripts/test-runtime.sh'
      - 'scripts/ci-*'
      - 'scripts/test-ci-*'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'auto, all, or comma-separated image names (including base)'
        default: all
        required: true

permissions:
  contents: read
  actions: read

# Never overlap publishers. PRs can discard superseded checks.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      pr_variants: ${{ steps.plan.outputs.pr_variants }}
      base: ${{ steps.plan.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          VARIANTS: ${{ inputs.variants || 'auto' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Include changes from failed or coalesced main runs, not just this push.
            BEFORE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          fi
          make lint
          python3 scripts/ci-plan.py --before "$BEFORE" --after "$AFTER" --variants "$VARIANTS" > plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open('plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in plan.items():
                  print(f'{key}={json.dumps(value, separators=(",", ":"))}', file=out)
          print(json.dumps(plan, indent=2))
          PY

  pr:
    name: Test affected images (amd64)
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test affected images
        env:
          BUILD_BASE: ${{ needs.plan.outputs.base }}
          PR_VARIANTS: ${{ needs.plan.outputs.pr_variants }}
        run: |
          set -euo pipefail
          # Native Docker shares the locally built base with dependent builds.
          export PLATFORM=linux/amd64
          if [ "$BUILD_BASE" = true ]; then
            VARIANTS=base scripts/build.sh
            scripts/test-image.sh base
            export BASE_IMAGE=multica-runtime:base
          else
            export BASE_IMAGE=ghcr.io/proreka/multica-runtime:base
          fi
          for variant in $(jq -r '.[]' <<< "$PR_VARIANTS"); do
            VARIANTS="$variant" scripts/build.sh
            scripts/test-image.sh "$variant"
            if [ "$variant" = php ] || [ "$variant" = design ]; then
              IMAGE="multica-runtime:$variant" scripts/test-runtime.sh "$variant"
            fi
          done

  base:
    name: Publish base
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.base == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and test
        run: |
          VARIANTS=base PUSH=1 CACHE_FROM=type=gha,scope=base CACHE_TO=type=gha,mode=max,scope=base scripts/build.sh
          docker pull ghcr.io/proreka/multica-runtime:base
          IMAGE_PREFIX=ghcr.io/proreka/multica-runtime scripts/test-image.sh base

  variants:
    name: Publish ${{ matrix.variant }}
    needs: [plan, base]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: matrix.variant == 'flutter' || matrix.variant == 'design'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and test
        env:
          VARIANTS: ${{ matrix.variant }}
          PLATFORMS: ${{ matrix.platforms }}
          PUSH: '1'
          CACHE_FROM: type=gha,scope=${{ matrix.variant }}
          CACHE_TO: type=gha,mode=max,scope=${{ matrix.variant }}
        run: |
          set -euo pipefail
          scripts/build.sh
          if [ "$VARIANTS" = autoscaler ]; then
            docker pull ghcr.io/proreka/multica-autoscaler:latest
            AUTOSCALER_IMAGE=ghcr.io/proreka/multica-autoscaler:latest scripts/test-image.sh autoscaler
          else
            docker pull "ghcr.io/proreka/multica-runtime:$VARIANTS"
            IMAGE_PREFIX=ghcr.io/proreka/multica-runtime scripts/test-image.sh "$VARIANTS"
            if [ "$VARIANTS" = php ] || [ "$VARIANTS" = design ]; then
              IMAGE="ghcr.io/proreka/multica-runtime:$VARIANTS" scripts/test-runtime.sh "$VARIANTS"
            fi
          fi

  release:
    name: Release existing images (no rebuild)
    needs: [plan, base, variants]
    if: >-
      always() && github.event_name == 'push' &&
      needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (needs.variants.result == 'success' || needs.variants.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Promote images and create patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci-release.py

name: Version Watcher

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Only one run at a time so daily runs never collide on the rolling branch.
concurrency:
  group: version-watcher
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    name: Check latest tool releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check upstream tool releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check-latest-versions.py --update

      - name: Verify and (re)create a single rolling PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="automation/bump-versions"
          BASE="main"

          if git diff --quiet versions.env; then
            echo "All tools in versions.env are up to date."
            exit 0
          fi

          echo "Updates found in versions.env:"
          git diff versions.env

          # Ensure updated versions pass repo linting before we touch any branch.
          make lint

          # Persist the updated versions.env before resetting the working tree
          # onto the latest main.
          cp versions.env /tmp/versions.env.new

          git fetch origin "$BASE"
          git reset --hard origin/"$BASE"
          cp /tmp/versions.env.new versions.env

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add versions.env
          git commit -m "chore(deps): bump tool versions in versions.env"

          # force-with-lease keeps exactly one commit on the rolling branch, so
          # there is never more than one active PR. Only this bot pushes here.
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
          fi
          git push --force-with-lease origin "$BRANCH"

          # Reuse an open PR for this branch if one exists; otherwise create it.
          # Pushing to the same head branch automatically updates an open PR.
          if gh pr list --head "$BRANCH" --base "$BASE" --state open \
              --json number -q '.[] | .number' | grep -q .; then
            echo "Rolling PR already open; updated in place."
          else
            CHANGES="$(git diff origin/"$BASE".."$BRANCH" -- versions.env | sed 's/^/  /')"
            {
              echo 'Automated daily version check detected upstream tool updates in `versions.env`.'
              echo
              echo '\`\`\`diff'
              printf '%s\n' "$CHANGES"
              echo '\`\`\`'
              echo
              echo 'This is a rolling PR: each daily run updates this same pull request instead of opening a new one. Merge when ready.'
            } > /tmp/pr-body.md
            gh pr create \
              --title "chore(deps): daily tool version updates" \
              --body-file /tmp/pr-body.md \
              --head "$BRANCH" \
              --base "$BASE" \
              --label automation,chore,dependencies
          fi

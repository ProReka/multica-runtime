# Multica runtime on Kubernetes.
#
#   kubectl create secret generic multica-runtime --from-env-file=.env
#   kubectl apply -f deploy/kubernetes/deployment.yaml
#
# One replica, no Service: the runtime connects out to Multica and your AI
# router. Sessions live on a PersistentVolumeClaim mounted at /workspaces.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multica-workspaces
  labels:
    app.kubernetes.io/name: multica-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods sharing MULTICA_DAEMON_ID would
  # compete for the same tasks.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-runtime
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/proreka/multica-runtime:base
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: multica-runtime
          env:
            - name: MULTICA_WORKSPACES_ROOT
              value: /workspaces
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f 'multica daemon' >/dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: multica-workspaces

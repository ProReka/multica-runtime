# Example only. Do not commit real values.
#
# Prefer creating the secret from your .env, which keeps the values out of git:
#
#   kubectl create secret generic multica-runtime --from-env-file=.env
#
# This file exists to document the keys the Deployment expects.
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime
type: Opaque
stringData:
  MULTICA_TOKEN: ""
  AI_BASE_URL: ""
  AI_API_KEY: ""
  AI_MODEL: ""
  # Optional:
  MULTICA_DAEMON_ID: multica-runtime
  MULTICA_AGENT_RUNTIME_NAME: Multica Runtime
  MULTICA_DAEMON_MAX_CONCURRENT_TASKS: "3"
